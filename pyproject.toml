[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nms-agent"
version = "0.1.0"
description = "NMS Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "langchain-core==1.5.6",
  "langchain-openai==1.5.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "psycopg[binary,pool]>=3.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
