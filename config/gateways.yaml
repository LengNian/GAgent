# MCP 网关配置：中台清单 × API 映射表
# 约定：
# - 所有敏感值（base_url、账号密码）一律写 env:VAR_NAME，绝不落明文；
# - description 是模型选择工具的唯一依据，必须写清"做什么、什么时候用"；
# - 接入新中台只需在 platforms 下追加一节，不改网关代码。

platforms:
  - name: nms
    base_url_env: env:NMS_BASE_URL
    auth:
      type: login_token
      login_endpoint: /api/v1/iam/login
      refresh_endpoint: /api/v1/iam/refresh
      username_env: env:NMS_USERNAME
      password_env: env:NMS_PASSWORD
      token_field: data.access_token
      refresh_token_field: data.refresh_token
      expires_in_field: data.expires_in
    apis:
      - name: query_device_by_ip
        description: 查询单台设备的基础信息，包括设备名称、类型、型号、位置、有线或无线接入方式、端口总数与 up/down 数量、邻居数量与邻居名称。当用户询问某台设备（给出 IP）是什么设备、在哪里、有多少端口、连着谁时使用；拓扑图结果或上一轮的历史查询结果都不能替代本工具。本工具不返回任何指标数值，CPU、内存、温度、流量、信号强度等当前值用 get_realtime_metric，一段时间内的趋势用 get_metric_range。
        method: GET
        endpoint: /api/v1/topology/device
        timeout_seconds: 10
        retry_attempts: 2
        risk_level: low
        requires_confirmation: true
        argument_locations:
          ip: query
        input_schema:
          type: object
          properties:
            ip:
              type: string
              description: 要查询的设备 IPv4 地址，例如 192.168.1.76
          required: [ip]
        error_messages:
          "404": 未找到该 IP 对应的设备。
          "5xx": 设备查询服务暂时不可用，请稍后重试。
        result_projection: device_series
      
      - name: get_topology_graph
        description: 获取全局网络拓扑聚合图，包含所有设备节点、链路及其状态。当用户询问整体网络结构、设备间连接关系或全网概况时使用；结果仅为聚合快照，用户追问某一台设备的详情时，必须改用 query_device_by_ip 查询设备基础信息，或改用 get_realtime_metric、get_metric_range 查询指标数值，不得直接依据本工具结果作答。
        method: GET
        endpoint: /api/v1/topology/graph
        timeout_seconds: 15
        retry_attempts: 2
        risk_level: low
        argument_locations: {}
        input_schema:
          type: object
          properties: {}
          required: []
        error_messages:
          "5xx": 拓扑服务暂时不可用，请稍后重试。
        result_projection: topology_graph
      
      - name: get_realtime_metric
        description: 查询指定设备 IP 上某个监控指标的实时瞬时值，可选按速率计算（如流量速率）。当用户询问某设备某指标的当前数值时使用；设备具体指标的数值一律走本工具，不要从 query_device_by_ip 的返回结果推断。
        method: GET
        endpoint: /api/v1/metric/metrics/realtime
        timeout_seconds: 10
        retry_attempts: 2
        risk_level: low
        argument_locations:
          ip: query
          metric: query
          rate: query
        input_schema:
          type: object
          properties:
            ip:
              type: string
              description: 设备 IPv4 地址
            metric:
              type: string
              description: 指标的精确名称，必须是本轮 list_metric_names 返回结果中逐字出现的字符串；不得自行拼写、翻译或缩写用户说的中文指标名，本轮没有该设备的名称列表时先调用 list_metric_names
            rate:
              type: boolean
              description: 是否计算速率，仅对流类指标（如流量）有意义，默认 false
          required: [ip, metric]
        error_messages:
          "404": 未找到该设备或指标。
          "5xx": 指标查询服务暂时不可用，请稍后重试。
        result_projection: metric_series
          
      - name: get_metric_range
        description: 查询指定设备 IP 上某个监控指标的时间序列数据，默认返回最近 1 小时。当用户询问指标的历史趋势或时间段变化时使用；设备指标随时间的变化一律走本工具，不要从 query_device_by_ip 的返回结果推断趋势。
        method: GET
        endpoint: /api/v1/metric/metrics/range
        timeout_seconds: 15
        retry_attempts: 2
        risk_level: low
        argument_locations:
          ip: query
          metric: query
          start: query
          end: query
          step: query
          rate: query
        input_schema:
          type: object
          properties:
            ip:
              type: string
              description: 设备 IPv4 地址
            metric:
              type: string
              description: 指标的精确名称，必须是本轮 list_metric_names 返回结果中逐字出现的字符串；不得自行拼写、翻译或缩写用户说的中文指标名，本轮没有该设备的名称列表时先调用 list_metric_names
            start:
              type: string
              description: 起始时间。写法是把用户说的时长原样写出、不加负号：过去 30 分钟写 30m、过去 12 小时写 12h、过去 7 天写 7d，也可填 10 位 Unix 秒；默认最近 1 小时。反例：-12h 会被解析成未来时间，导致窗口倒挂、返回空数据。
            end:
              type: string
              description: 结束时间，只接受 10 位 Unix 秒或不带负号的相对时长；必须晚于 start，默认当前时间。
            step:
              type: integer
              description: 采样步长（秒），中台按此重采样，直接决定返回点数：12 小时窗口用 15 会得到约 2880 点/序列。选值：窗口 1 小时内用默认 15 看细节；超过 2 小时至少 300；超过 8 小时至少 900；超过 24 小时用 3600。
            rate:
              type: boolean
              description: 计数器类指标是否计算速率；默认 false。
          required: [ip, metric]
        error_messages:
          "404": 未找到该设备或指标。
          "5xx": 指标查询服务暂时不可用，请稍后重试。
        argument_guard: time_window
        result_projection: metric_series
      
      - name: list_metric_names
        description: 列出指定设备可用的监控指标名称，是调用指标工具时指标名的唯一合法来源。在调用 get_realtime_metric 或 get_metric_range 之前，若本轮还没有该设备的指标名称列表，必须先调用本工具；用户说的中文指标名不是合法参数，需在本工具返回的列表中确认逐字相同的精确名称。
        method: GET
        endpoint: /api/v1/metric/metrics/list
        timeout_seconds: 10
        retry_attempts: 2
        risk_level: low
        argument_locations:
          ip: query
        input_schema:
          type: object
          properties:
            ip:
              type: string
              description: 可选的设备 IPv4 过滤条件
          required: []
        error_messages:
          "5xx": 指标服务暂时不可用，请稍后重试。

      - name: list_alarm_events
        description: 查询告警事件列表，可按规则、严重级别、状态、目标类型、目标 ID 和首次触发时间范围筛选。当用户查询设备告警、近期告警或需要进行告警根因分析时使用。
        method: GET
        endpoint: /api/v1/alarm/alarm-events
        timeout_seconds: 10
        retry_attempts: 2
        risk_level: low
        argument_locations:
          RuleId: query
          Severity: query
          Status: query
          TargetType: query
          TargetId: query
          FirstTriggeredAtFrom: query
          FirstTriggeredAtTo: query
        input_schema:
          type: object
          properties:
            RuleId:
              type: string
              description: JSON 字符串形式的规则筛选条件，可选。
            Severity:
              type: string
              description: JSON 字符串形式的严重级别筛选条件，可选。
            Status:
              type: string
              description: JSON 字符串形式的告警状态筛选条件，可选。
            TargetType:
              type: string
              description: JSON 字符串形式的目标类型筛选条件，可选。
            TargetId:
              type: string
              description: JSON 字符串形式的目标 ID 筛选条件，可选。
            FirstTriggeredAtFrom:
              type: integer
              format: int64
              description: 首次触发时间范围起点，Unix 秒，可选。
            FirstTriggeredAtTo:
              type: integer
              format: int64
              description: 首次触发时间范围终点，Unix 秒，可选。
          required: []
        error_messages:
          "401": 未认证，请检查 NMS 登录状态。
          "403": 当前账号没有查询告警事件的权限。
          "5xx": 告警服务暂时不可用，请稍后重试。

# 外部 MCP Server 联邦接入：网关作为上游 MCP 客户端，启动时发现其工具并以
# `服务名.工具名` 重新暴露。接入新的外部能力只需在此追加一节，不改网关代码。
mcp_servers:
  - name: weather
    transport: stdio
    command: "npx"
    args: ["-y", "open-meteo-mcp"]
    # Open-Meteo 免费无需 API Key；如上游需要凭证，写 env:VAR_NAME 引用环境变量。
    env: {}
    timeout_seconds: 60
