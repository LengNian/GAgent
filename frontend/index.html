<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6">
  <title>NMS Agent</title>
  <link rel="stylesheet" href="./styles.css?v=20260824-4">
  <script defer src="./app.js?v=20260824-4"></script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span class="brand-copy"><strong>NMS Agent</strong><small>运维对话</small></span>
        </div>
        <button class="icon-button sidebar-toggle" id="toggleSidebar" type="button" title="收起侧栏" aria-label="收起侧栏" aria-expanded="true"><span aria-hidden="true">‹</span></button>
      </div>
      <button class="button primary sidebar-new-thread" id="newThread" type="button"><b aria-hidden="true">+</b><span>新对话</span></button>
      <div class="sidebar-section">
        <p class="eyebrow">最近对话</p>
        <nav class="thread-history" id="threadHistory" aria-label="聊天记录"></nav>
        <p class="sidebar-empty" id="historyEmpty">暂无聊天记录</p>
      </div>
      <div class="sidebar-footer">
        <span class="user-avatar" aria-hidden="true">A</span>
        <div class="user-copy"><small>当前用户</small><strong id="currentUser">admin</strong></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="openSidebar" type="button" title="展开侧栏" aria-label="展开侧栏"><span aria-hidden="true">☰</span></button>
        <div class="topbar-context"><p class="eyebrow">NMS / ASSISTANT</p><span>智能运维工作台</span></div>
        <div class="topbar-actions">
          <span class="session-status"><i id="statusDot" aria-hidden="true"></i><span id="sessionStatus">无活动会话</span></span>
          <button class="button" id="agentLogin" type="button">模拟 Agent 登录</button>
        </div>
      </header>
      <div class="workspace">
      <section class="conversation" aria-label="对话区域">
        <header class="conversation-header">
          <div><p class="eyebrow">NMS / ASSISTANT</p><h1 id="conversationTitle">从一个问题开始</h1></div>
          <div class="conversation-actions">
            <div class="conversation-status"><span id="connectionDot" aria-hidden="true"></span><span id="connectionStatus">等待连接</span><span class="thread-id" id="threadId">—</span><span class="hidden" id="railStatus">未连接</span><span class="hidden" id="connectionNote">创建会话后连接服务。</span></div>
            <button class="icon-button hidden" id="clearThread" type="button" title="退出当前会话" aria-label="退出当前会话">×</button>
          </div>
        </header>
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="error hidden" id="error" role="alert"><span class="error-icon">!</span><span id="errorText"></span><button class="link-button hidden" id="retry" type="button">重试</button><button class="link-button" id="dismissError" type="button">关闭</button></div>
        <form class="composer" id="chatForm">
          <textarea id="input" rows="1" maxlength="4000" disabled placeholder="创建会话后输入问题"></textarea>
          <div class="composer-footer"><span id="hint">创建会话后可发送</span><span class="counter" id="counter">0 / 4000</span><button class="button send" id="send" type="submit" disabled>发送 <b aria-hidden="true">→</b></button></div>
        </form>
      </section>
      </div>
    </main>
  </div>
</body>
</html>
